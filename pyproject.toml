[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "zedd-weather"
version = "1.2.0"
description = "Multi-sector heuristic weather risk analysis engine"
requires-python = ">=3.11"

[project.scripts]
zedd = "Zweather.cli:main"

[tool.setuptools.packages.find]
include = ["Zweather*"]
